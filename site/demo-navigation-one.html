<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation demos (test) · SAIM Robotics</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    .dn-label { margin: 0 0 14px; }
    .dn-sized { width: min(400px, 100%); height: 260px; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
    .dn-sized > [data-demo] { height: 100%; }
    .dn-ambient { position: relative; min-height: 70vh; display: grid; place-items: center; overflow: hidden; }
    .dn-ambient > [data-demo] { position: absolute; inset: 0; }
    .dn-ambient .container { position: relative; z-index: 1; pointer-events: none; }
    .dn-row { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); align-items: start; }
  </style>
</head>
<body data-page="demo-navigation">
  <main id="main">
    <section class="section section--tight"><div class="container stack">
      <p class="eyebrow">Test page · demos-navigation</p>
      <h1 class="h2">route-replan</h1>
      <p class="mono dn-label">default (dark)</p>
      <div id="rr-default" data-demo="route-replan"></div>
      <p class="mono dn-label">interactive</p>
    <section class="section section--paper section--tight"><div class="container stack">
      <p class="mono dn-label">route-replan · paper theme</p>
      <div data-demo="route-replan" data-options='{"theme":"paper"}'></div>
    </div></section>
  </main>
  <script type="module" src="/src/pages/demo-navigation.js"></script>
</body>
</html>
